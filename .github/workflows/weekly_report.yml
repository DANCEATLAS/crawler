name: weekly_report
# The owner's weekly report — "I get an e-mail every week. That is a must. And the e-mail must be laid out properly."
# Built by pipeline/weekly_report.py from the repository and its git history (no model calls, nothing to pay): growth,
# the ladder, every piece of every published profile, what the filters kept out, what would help most, machine health —
# this week, the last four weeks, since the start.
#
# Delivery, exactly one e-mail a week:
#   1. The designed e-mail (reports/weekly/latest.html: table layout, inline styles) is sent by SMTP when the secrets
#      REPORT_SMTP_USER + REPORT_SMTP_PASSWORD exist (a Gmail address and its app password; REPORT_TO = the inbox it
#      goes to; REPORT_SMTP_HOST / REPORT_SMTP_PORT only for a non-Gmail sender).
#   2. When those secrets are missing, or the send fails, the report is posted to the pinned issue
#      "📬 Weekly library report" instead; the owner is assigned to it, so GitHub e-mails him the comment.
#   A failed send also turns this run red, so it is noticed. The watchdog workflow re-runs this report when GitHub drops
#   the schedule; the guard below stops a late scheduled run from sending a second e-mail the same week.
on:
  schedule:
    - cron: "23 23 * * 0"   # Sunday 23:23 UTC = Monday morning for the owner (UTC+9); GitHub may delay it by hours
  workflow_dispatch:
    inputs:
      force:
        description: "send even if this week's report already went out (tests)"
        required: false
        default: "false"
permissions:
  contents: write
  issues: write
concurrency:
  group: atlas-pipeline      # never runs while the daily pipeline is committing
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # the comparisons read the tree as it was 7 / 28 days ago and at the start of the year
      - name: One report a week — skip if this week's already went out
        id: guard
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          # The report week starts on Sunday (UTC). A report already made since then means this week's e-mail went out.
          WEEK_START=$(date -u -d "$(date -u +%F) -$(( $(date -u +%u) % 7 )) days" +%F)
          STAMP=$(grep -m1 -oE 'weekly report · [A-Za-z]{3} [0-9]{2} [A-Za-z]{3} [0-9]{4}' WEEKLY_REPORT.md 2>/dev/null | sed 's/weekly report · //' || true)
          LAST=$( [ -n "$STAMP" ] && date -u -d "$STAMP" +%F || echo "none" )
          echo "last report: $LAST; this report week started $WEEK_START; force=${FORCE:-false}"
          if [ "$LAST" != "none" ] && [[ ! "$LAST" < "$WEEK_START" ]] && [ "${FORCE:-false}" != "true" ]; then
            echo "this week's report already went out: nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"
      - name: Build the report
        if: steps.guard.outputs.skip != 'true'
        run: python -m pipeline.weekly_report > /dev/null
      - name: Commit the report
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "danceworld-crawler"
          git config user.email "crawler@users.noreply.github.com"
          git add -A
          git commit -m "weekly report $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push || echo "push failed"
      - name: E-mail the designed report (the owner's channel)
        id: mail
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          REPORT_SMTP_USER: ${{ secrets.REPORT_SMTP_USER }}
          REPORT_SMTP_PASSWORD: ${{ secrets.REPORT_SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_SMTP_HOST: ${{ secrets.REPORT_SMTP_HOST }}
          REPORT_SMTP_PORT: ${{ secrets.REPORT_SMTP_PORT }}
        run: python -m pipeline.weekly_report --send
      - name: Fallback — post to the issue thread (GitHub e-mails it) when the designed e-mail was not sent
        if: steps.guard.outputs.skip != 'true' && steps.mail.outputs.sent != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          gh label create weekly-report --repo "$REPO" --description "The owner's weekly library report" --color 4a7c59 2>/dev/null || true
          N=$(gh issue list --repo "$REPO" --label weekly-report --state open --json number --jq '.[0].number // empty')
          if [ -z "$N" ]; then
            cat > /tmp/issue_body.md <<'EOF'
          This thread is the fallback channel of the **weekly report of the Dance Atlas library**. The report normally goes
          straight to your inbox as a designed e-mail; when that e-mail cannot be sent, the machine posts the report here
          instead, and GitHub e-mails it to you because you are assigned to this issue.

          The latest report is also the file `WEEKLY_REPORT.md` in this repository; older ones are in `reports/weekly/`.
          The standard behind the numbers is `STANDARD.md`. Nothing to do here. Keep the issue open.
          EOF
            URL=$(gh issue create --repo "$REPO" --title "📬 Weekly library report" --label weekly-report --assignee "$OWNER" --body-file /tmp/issue_body.md \
                  || gh issue create --repo "$REPO" --title "📬 Weekly library report" --label weekly-report --body-file /tmp/issue_body.md)
            N=$(echo "$URL" | grep -o '[0-9]*$')
            gh issue pin "$N" --repo "$REPO" 2>/dev/null || true
          fi
          echo "posting to issue #$N"
          gh issue comment "$N" --repo "$REPO" --body-file WEEKLY_REPORT.md
      - name: Make a failed e-mail visible
        if: steps.guard.outputs.skip != 'true' && steps.mail.outputs.configured == 'true' && steps.mail.outputs.sent != 'true'
        run: |
          echo "::error::The designed e-mail could not be sent (see the e-mail step). This week's report went to the issue thread instead."
          exit 1
