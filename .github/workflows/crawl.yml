name: crawl
on:
  schedule:
    - cron: "15 8 * * *"

  workflow_dispatch:
permissions:
  contents: write
# the crawler and the daily run both commit result files: one at a time, never cancelled
concurrency:
  group: atlas-pipeline
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # a run that waited starts from what the run before it saved (see atlas_daily.yml)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp
      - name: Crawl
        timeout-minutes: 150   # the step may be cut short; the next step still saves what was found (each dance is written as it is done)
        run: python crawler.py
        env:
          YT_API_KEYS: ${{ secrets.YT_API_KEYS }}
          MODE: all
          BUDGET_HERO: "600"
          BUDGET_TUTORIAL: "150"
          # Lesson rule 2 (24 November 2026): the dances that found no lesson under the older rule are looked for once more,
          # this many a day and for at most this many minutes, those nearest the starting line first (crawler.py, TUT_RULE)
          TUT_WAVE: "100"
          # 40 minutes, not 100: the night waits for the crawl to end, and a night that begins after about 20:00 UTC meets a busy provider
          TUT_MAX_MINUTES: "40"
          BUDGET_VIRAL: "300"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Save results back to repo
        if: always()
        run: |
          git config user.name "danceworld-crawler"
          git config user.email "crawler@users.noreply.github.com"
          git add -A
          git commit -m "crawler results" || echo "nothing to commit"
          git pull --rebase origin main
          git push
      # The step "Score virals" (score_virals.py) was taken out on 25 November 2026. It failed every day since at least 31 October
      # (the mirror answers 400 to its first question), nothing reads what it wrote (the site takes the viral list from
      # public/catalog/), and its red mark sat on every crawl. The script stays in the repository.
