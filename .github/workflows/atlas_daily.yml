name: atlas_daily
# Dancing Atlas content pipeline v3: discover -> research -> QC -> hero QC -> sync -> report.
# Runs after the crawler chain (crawl 08:15, push_videos 08:45, push_tutorials 08:50, push_viral 08:55 UTC).
on:
  schedule:
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "daily | one stage (bootstrap, audit, discover, research, qc, hero_qc, build, pedagogy, teaching, footage, pictures, episodes, translate, activation, readiness, door, sync, report, selftest) | several with commas, run in that order: build,episodes,activation,readiness,door"
        default: "daily"
      research_new:
        description: "new dances to research this run"
        default: "40"
      research_enrich:
        description: "existing dances to deepen this run"
        default: "30"
      hero_qc_budget:
        description: "hero videos to check this run"
        default: "120"
      discover_max_new:
        description: "max new candidates to queue"
        default: "60"
      only:
        description: "comma-separated slugs (optional)"
        default: ""
permissions:
  contents: write
concurrency:
  group: atlas-pipeline
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          # A run that waited behind another starts from what that run saved, not from the commit of the moment it was asked for.
          # Without this, a night that waits for a crawl still in progress works on the files of before the crawl, both then save
          # crawler_cache.json and hero_results.json, and the night's save cannot be joined to the crawl's: the whole night is lost.
          # Measured on 12 to 23 November 2026: the crawl saved 42 to 75 minutes before the night began; the second look of
          # lesson rule 2 makes the crawl longer. Same line in crawl.yml and weekly_report.yml (one waiting place for the three).
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp
      - name: Self-test (offline)
        run: python -m pipeline.run selftest
      - name: Run pipeline
        timeout-minutes: 310   # the step may be cut short; the commit step below still runs and saves what was done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YT_API_KEYS: ${{ secrets.YT_API_KEYS }}
          # The writing engine: Google's Gemini FREE tier only (no billing is attached to this key; pipeline_state/spending_policy.json).
          # The OpenAI key is deliberately not passed: no paid model can be called from here.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEARCH_NEW: ${{ github.event.inputs.research_new || '40' }}
          RESEARCH_ENRICH: ${{ github.event.inputs.research_enrich || '30' }}
          RESEARCH_COMPLETION_MAX: "10"
          HERO_QC_BUDGET: ${{ github.event.inputs.hero_qc_budget || '120' }}
          DISCOVER_MAX_NEW: ${{ github.event.inputs.discover_max_new || '60' }}
          AUDIT_LLM_BUDGET: "150"
          # budgets are sized to the free tier: flash 20 requests a day per model (kept for the writer); flash-lite carries judges and video (on 16 Nov only the newest flash-lite model had a large day quota)
          # the movie phase (MOVIE_PHASE.md): tutorial videos studied per day (Gemini watches the public YouTube URL, free tier),
          # and episode packs whose narration the model may polish per day (0 = assembled text only; polished text is verified)
          # raised 21 Nov 2026 (24 to 40 lessons, 30 to 50 performances): the hero check had caught up, the free day had room
          # (about 240 questions a night of the 400 and more it has carried), and 326 lessons and 501 performances were waiting.
          # 23 Nov 2026: they stay. The night of 21 Nov looked as if this study had used up the day's quota (the mentor's study
          # stopped at its tenth lesson, without its looks and its reading). The log said otherwise: one model answered 429 on a
          # question whose video the next model refused, and the mentor stage's stop rule read that as "nobody can be asked".
          # The night of 22 Nov ran these same budgets whole (88 video answers here, 20 in the mentor's study, 6 topics and
          # 4 papers read). The rule is repaired, the mentor's study now runs before this one and reads its research first.
          PEDAGOGY_BUDGET: "40"
          # performances observed per day: what a dance looks and sounds like in its own hero video (dances without a lesson on the web)
          PERFORMANCE_BUDGET: "50"
          # teaching research for the Best Dance Friend (BDF_TEACHING_SYSTEM.md): lessons watched a day for HOW the teacher teaches
          # (one free video call each, read together with the public comments; BASICS_SHARE of them teach what every dance shares),
          # free searches a day for such basics lessons (yt-dlp, no API search quota), research topics written a day from open sources,
          # and papers a day from the open search (Europe PMC, most cited first)
          TEACHING_BUDGET: "10"
          BASICS_SHARE: "3"
          FOUNDATION_SEARCHES: "3"
          # raised 21 Nov 2026 (3 to 6 topics, 2 to 4 papers): 53 of the 80 research topics were still unread, among them the owner's
          # topics of that day (ease and openness, an experience that inspires, learners who learn to teach), which are read first.
          # Five more short text questions a night; the stage used 8 to 12 of its 40 minutes
          SCIENCE_BUDGET: "6"
          PAPER_BUDGET: "4"
          TEACHING_MAX_MINUTES: "40"
          # time guards: a slow model day must not eat the run (the judge, the build and the report still have to happen)
          RESEARCH_MAX_MINUTES: "180"
          PEDAGOGY_MAX_MINUTES: "60"
          LLM_TIMEOUT_STRONG: "300"
          # When every usable model is resting (overloaded), a question waits for it instead of being dropped: at most this
          # long a night, and one stage takes at most its share of it. On the night of 23 November 2026 the provider
          # was overloaded for hours, the research stage alone waited 2,346 of 2,400 seconds, and the judge and both video
          # studies found nobody to ask (59 of 221 questions unanswered). A stage now waits 12 minutes at most and the night
          # an hour: five stages ask many questions, so the last of them (the lesson study) keeps its share. Research stops
          # for the night after three dances in a row got no answer from any model; its queue keeps its place.
          LLM_WAIT_BUDGET_SECONDS: "3600"
          LLM_WAIT_STAGE_SECONDS: "720"
          EPISODE_POLISH: "4"
          # reference-footage lists read a night (one text question a dance: does each clip show this dance?); a run by hand reads the backlog
          FOOTAGE_BUDGET: "150"
          # profiles without a licensed picture looked for a night (the Commons category, the article in other languages, a search by name; read before kept)
          PICTURES_BUDGET: "60"
          # one narrator, every language: gap-free packs are translated scene by scene (TRANSLATE_BUDGET calls a day) into these languages
          TRANSLATE_BUDGET: "6"
          TRANSLATE_LANGS: "es,fr,de,pt,it,ja,zh,ko,ar,hi,ru,id"
          APP_CATALOG_URL: "https://id-preview--f79f3666-564d-4799-befe-8b48d1f0a007.lovable.app/dances.app.json"
        run: |
          STAGE="${{ github.event.inputs.stage || 'daily' }}"
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then python -m pipeline.run "$STAGE" --only "$ONLY"; else python -m pipeline.run "$STAGE"; fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "danceworld-crawler"
          git config user.email "crawler@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "pipeline: ${{ github.event.inputs.stage || 'daily' }} $(date -u +%F)"; fi
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          [ "$pushed" = "1" ]
