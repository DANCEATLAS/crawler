name: atlas_daily
# Dancing Atlas content pipeline v3: discover -> research -> QC -> hero QC -> sync -> report.
# Runs after the crawler chain (crawl 08:15, push_videos 08:45, push_tutorials 08:50, push_viral 08:55 UTC).
on:
  schedule:
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "daily | bootstrap | audit | discover | research | qc | hero_qc | build | pedagogy | episodes | translate | activation | readiness | sync | report | selftest"
        default: "daily"
      research_new:
        description: "new dances to research this run"
        default: "40"
      research_enrich:
        description: "existing dances to deepen this run"
        default: "30"
      hero_qc_budget:
        description: "hero videos to check this run"
        default: "120"
      discover_max_new:
        description: "max new candidates to queue"
        default: "60"
      only:
        description: "comma-separated slugs (optional)"
        default: ""
permissions:
  contents: write
concurrency:
  group: atlas-pipeline
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp
      - name: Self-test (offline)
        run: python -m pipeline.run selftest
      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YT_API_KEYS: ${{ secrets.YT_API_KEYS }}
          # The writing engine: Google's Gemini FREE tier only (no billing is attached to this key; pipeline_state/spending_policy.json).
          # The OpenAI key is deliberately not passed: no paid model can be called from here.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEARCH_NEW: ${{ github.event.inputs.research_new || '40' }}
          RESEARCH_ENRICH: ${{ github.event.inputs.research_enrich || '30' }}
          RESEARCH_COMPLETION_MAX: "10"
          HERO_QC_BUDGET: ${{ github.event.inputs.hero_qc_budget || '120' }}
          DISCOVER_MAX_NEW: ${{ github.event.inputs.discover_max_new || '60' }}
          AUDIT_LLM_BUDGET: "150"
          # budgets are sized to the free tier: flash 20 requests a day per model (kept for the writer), flash-lite 500 a day per model (judges, video)
          # the movie phase (MOVIE_PHASE.md): tutorial videos studied per day (Gemini watches the public YouTube URL, free tier),
          # and episode packs whose narration the model may polish per day (0 = assembled text only; polished text is verified)
          PEDAGOGY_BUDGET: "24"
          # performances observed per day: what a dance looks and sounds like in its own hero video (dances without a lesson on the web)
          PERFORMANCE_BUDGET: "30"
          # time guards: a slow model day must not eat the run (the judge, the build and the report still have to happen)
          RESEARCH_MAX_MINUTES: "180"
          PEDAGOGY_MAX_MINUTES: "60"
          LLM_TIMEOUT_STRONG: "300"
          EPISODE_POLISH: "4"
          # one narrator, every language: gap-free packs are translated scene by scene (TRANSLATE_BUDGET calls a day) into these languages
          TRANSLATE_BUDGET: "6"
          TRANSLATE_LANGS: "es,fr,de,pt,it,ja,zh,ko,ar,hi,ru,id"
          APP_CATALOG_URL: "https://id-preview--f79f3666-564d-4799-befe-8b48d1f0a007.lovable.app/dances.app.json"
        run: |
          STAGE="${{ github.event.inputs.stage || 'daily' }}"
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then python -m pipeline.run "$STAGE" --only "$ONLY"; else python -m pipeline.run "$STAGE"; fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "danceworld-crawler"
          git config user.email "crawler@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "pipeline: ${{ github.event.inputs.stage || 'daily' }} $(date -u +%F)"; fi
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          [ "$pushed" = "1" ]
