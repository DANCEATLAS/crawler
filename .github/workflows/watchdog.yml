name: watchdog
# The machine watches itself. GitHub sometimes drops or delays a scheduled run for hours; this job runs every six hours
# and, if the daily run has not succeeded in the last 30 hours (and none is running or queued), starts it. From Monday
# 06:00 UTC to Wednesday it also checks that this week's report went out (WEEKLY_REPORT.md dated on or after Sunday) and
# runs it if not — the report's own guard stops a second e-mail if the late scheduled run arrives afterwards. No model calls,
# no secrets beyond the workflow token, nothing to maintain. Everything it does is visible in the Actions list.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Daily run — restart it when the schedule was dropped
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          LAST=$(gh run list --repo "$REPO" --workflow atlas_daily.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt // empty')
          ACTIVE=$(gh run list --repo "$REPO" --workflow atlas_daily.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length')
          NOW=$(date -u +%s)
          if [ -n "$LAST" ]; then AGE=$(( (NOW - $(date -u -d "$LAST" +%s)) / 3600 )); else AGE=999; fi
          echo "last successful daily run: ${LAST:-none} (${AGE} h ago); active runs: ${ACTIVE}"
          if [ "$AGE" -ge 30 ] && [ "$ACTIVE" = "0" ]; then
            echo "no successful daily run in ${AGE} h and nothing running: starting atlas_daily"
            gh workflow run atlas_daily.yml --repo "$REPO" -f stage=daily
          else
            echo "daily run is fine"
          fi
      - name: Weekly report — run it when Sunday night's schedule was dropped
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          DOW=$(date -u +%u); HOUR=$(date -u +%H)   # 1 = Monday … 7 = Sunday
          if [ "$DOW" != "1" ] && [ "$DOW" != "2" ] && [ "$DOW" != "3" ]; then echo "not a check day"; exit 0; fi
          if [ "$DOW" = "1" ] && [ "$HOUR" -lt 6 ]; then echo "Monday before 06:00 UTC: the Sunday-night run may only be delayed"; exit 0; fi
          WEEK_START=$(date -u -d "$(date -u +%F) -$(( DOW % 7 )) days" +%F)
          STAMP=$(grep -m1 -oE 'weekly report · [A-Za-z]{3} [0-9]{2} [A-Za-z]{3} [0-9]{4}' WEEKLY_REPORT.md 2>/dev/null | sed 's/weekly report · //' || true)
          LAST=$( [ -n "$STAMP" ] && date -u -d "$STAMP" +%F || echo "0000-00-00" )
          echo "last report: $LAST; this report week started $WEEK_START"
          if [[ "$LAST" < "$WEEK_START" ]]; then
            ACTIVE=$(gh run list --repo "$REPO" --workflow weekly_report.yml --limit 3 --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$ACTIVE" = "0" ]; then echo "this week's report is missing: running weekly_report"; gh workflow run weekly_report.yml --repo "$REPO"; else echo "a report run is already queued or running"; fi
          else
            echo "this week's report went out"
          fi
